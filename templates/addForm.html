{{define "addForm"}}
<form
    id="{{.}}-form"
    hx-put="/admin/fridge/{{.}}/add"
    hx-swap="beforeend"
    hx-target="#{{.}}-table"
>
    <div class="scroll-x-overflow">
        <fieldset role="group">
            <input
                type="text"
                placeholder="Namn"
                name="name"
                style="min-width: 15ch"
            />
            <input
                type="number"
                placeholder="Pris"
                name="price"
                step="0.01"
                style="min-width: 15ch"
            />
            <input type="submit" value="Lägg till" />
        </fieldset>
    </div>
</form>
{{end}}
