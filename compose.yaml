services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - PORT=2000
      - OIDC_PROVIDER=http://localhost:7003
      - OIDC_ID=client-id
      - OIDC_SECRET=client-secret
      - OIDC_REDIRECT_URL=http://localhost:2000/oidc/callback
      - DATABASE_URL=postgres://bea:bea@db:5432/bea
      - SSO_URL=http://nyckeln:7003
      - HIVE_URL=http://nyckeln:7004/api/v1
      - HIVE_TOKEN=testt
    ports: [2000:2000]
    configs:
      - source: nginx.conf
        target: /etc/nginx/nginx.conf
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./static
          target: /app/static
          action: sync
        - path: ./templates
          target: /app/templates
          action: sync
        - path: ./src
          action: rebuild
  db:
    image: "postgres:latest"
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: bea
      POSTGRES_PASSWORD: bea
      POSTGRES_DB: bea
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -d bea -U bea'"
      interval: 2s
      timeout: 3s
      retries: 8

  nyckeln:
    image: ghcr.io/datasektionen/nyckeln-under-dorrmattan
    ports:
      - 7003:7003
      - 7004:7004
    configs:
      - source: nyckeln.yaml
        target: /config.yaml

configs:
  nginx.conf:
    content: |
      events {}

      http {
        server {
          listen 7003;

          location / {
            proxy_pass http://nyckeln:7003;
          }
        }
      }

  nyckeln.yaml:
    content: |
      clients:
        - id: client-id
          secret: client-secret
          redirect_uris:
            - http://localhost:2000/oidc/callback

